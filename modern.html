<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chase Card</title>
<meta name="description" content="Chase Card – Hunt the Hit: Vintage and Modern chase lists.">
<meta name="apple-mobile-web-app-title" content="Chase Card">
<meta name="application-name" content="Chase Card">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d111c">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="manifest" href="manifest-modern.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #0d111c; overflow: hidden; }
  #app { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: block; background: #0d111c; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            color: #a3acc2; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #0d111c; transition: opacity .3s; }
  #splash img { width: 120px; height: 120px; border-radius: 27px; }
  #splash a { color: #91a7ff; display: none; }
  #splash.slow a { display: inline; }
  #splash.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<iframe id="app" title="Chase Card" allow="clipboard-write *; web-share *; fullscreen *"></iframe>
<div id="splash"><img src="apple-touch-icon.png" alt=""><div>Loading Chase Card…</div><a id="direct" href="#">Taking long? Open the app directly</a></div>
<script>
  // Chase Card launcher: gives the Apps Script web app a real Home Screen icon and name.
  // The app itself stays at the same /exec address; ?list=modern is passed through.
  var EXEC = 'https://script.google.com/macros/s/AKfycbx6OLtSC_yHNAT0OGw-ecto1Z7UaJidL7i-8jeWqWlnHxYu_-kb8Kiju5NzTYaSLKMJGw/exec';
  var list = (new URLSearchParams(location.search).get('list') || 'modern').toLowerCase();
  var url = EXEC + (list === 'modern' ? '?list=modern' : '');
  var frame = document.getElementById('app'), splash = document.getElementById('splash');
  document.getElementById('direct').href = url;
  frame.addEventListener('load', function () { splash.classList.add('gone'); });
  setTimeout(function () { splash.classList.add('slow'); }, 12000);
  frame.src = url;
</script>
</body>
</html>
